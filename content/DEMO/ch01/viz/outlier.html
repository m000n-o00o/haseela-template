<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القيمة الشاذة: المتوسط يتحرك والوسيط يثبت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<script>/* theme: ?theme=light|dark, else follow the device */(function(){var t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<style>/* حصيلة — generated from tokens.json */
:root, [data-theme="light"] {
  --surface: #f5f2ea; --surface-raised: #fbf9f4; --surface-sunken: #ece7db;
  --ink: #1e2629; --ink-muted: #566064; --line: #d9d2c2;
  --brand: #5b3768; --brand-soft: #ede3f0; --on-brand: #fbf9f4;
  --example: #4a6626; --example-soft: #e6edd9;
  --warning: #a3402a; --warning-soft: #f6e1da;
  --highlight: #f2dc8a;
  --must-know: #7a4a0c; --must-know-soft: #f6e5c3;
  --focus-star: #b9770e; --focus-ring: var(--brand);
  --shadow-card: 0 1px 2px rgba(30,38,41,0.06), 0 4px 12px rgba(30,38,41,0.05);
}
[data-theme="dark"] {
  --surface: #15191b; --surface-raised: #1c2124; --surface-sunken: #101315;
  --ink: #e9e5db; --ink-muted: #a3abae; --line: #30373a;
  --brand: #c9a6d8; --brand-soft: #2d2133; --on-brand: #15191b;
  --example: #a7c77e; --example-soft: #243019;
  --warning: #eb9a84; --warning-soft: #3a221c;
  --highlight: #5c4c1c;
  --must-know: #ebc27a; --must-know-soft: #3a2d17;
  --focus-star: #e5ae4f; --focus-ring: var(--brand);
  --shadow-card: none;
}
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 14px; --radius-pill: 999px;
  --font-sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-arabic: "IBM Plex Sans Arabic", "IBM Plex Sans", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;line-height:1.6}
main{max-width:1060px;margin:auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 2px;font-weight:600}
.lead{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.mono{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:.92rem}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{font-size:.92rem;color:var(--mute)}
input[type=range]{accent-color:var(--accent);width:160px}
input[type=number]{font:inherit;width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center}
th{color:var(--mute);font-weight:500}
tr.cur td{background:var(--soft)}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:.85rem}
.tag.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.note{font-size:.88rem;color:var(--mute)}
svg text{fill:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}

:root,[data-theme]{--bg:var(--surface);--card:var(--surface-raised);--mute:var(--ink-muted);--accent:var(--brand);--accent2:var(--warning);--good:var(--example);--bad:var(--warning);--soft:var(--brand-soft)}
html,body{font-family:var(--font-arabic)}
.mono{font-family:var(--font-mono)}
.card{border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
button{border-radius:var(--radius-md);min-height:44px;font-family:var(--font-arabic)}
button.primary{color:var(--on-brand)}
svg text{font-family:var(--font-sans)}

svg{width:100%;height:auto;display:block}
.axis{stroke:var(--mute);stroke-width:1}
.pt{fill:var(--accent2)}
.pt.last{fill:var(--accent)}
.mk-mean{stroke:var(--accent);stroke-width:3}
.mk-med{stroke:var(--accent2);stroke-width:3;stroke-dasharray:6 4}
td.v{font-family:var(--font-mono)}
input[type=range]{width:100%}
</style>
</head>
<body>
<main>
<h1>القيمة الشاذة: المتوسط يتحرك والوسيط يثبت</h1>
<p class="lead">البيانات من السلايد 3: 4، 7، 7، 9، والقيمة الأخيرة تتحكم فيها أنت. حرّكها وراقب المتوسط والوسيط والتشتت.</p>

<div class="card">
  <label for="last">القيمة الأخيرة: <b class="ltr" id="lastv"></b></label>
  <input type="range" dir="ltr" id="last" min="9" max="60" step="1" value="13">
</div>

<div class="grid">
  <div class="card">
    <svg id="plot" viewBox="0 0 420 140" role="img" aria-label="خط أعداد عليه القيم والمتوسط والوسيط"></svg>
    <p class="note">الخط المتصل هو المتوسط، والمتقطع هو الوسيط.</p>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>المقياس</th><th>القيمة</th></tr></thead>
      <tbody id="stats"></tbody>
    </table>
    <p class="note" id="msg" aria-live="polite" style="margin-top:10px"></p>
  </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const BASE=[4,7,7,9];
const f=(v,d)=>Number.isInteger(v)?String(v):v.toFixed(d);
function draw(){
 const last=+$('last').value,x=[...BASE,last].sort((a,b)=>a-b),n=x.length;
 const mean=x.reduce((s,v)=>s+v,0)/n,med=x[(n-1)/2];
 const ss=x.reduce((s,v)=>s+(v-mean)**2,0);
 $('lastv').textContent=last;
 $('stats').innerHTML=[
  ['المتوسط',f(mean,2)],['الوسيط',f(med,2)],['المدى',f(x[n-1]-x[0],2)],
  ['تباين المجتمع (القسمة على n)',f(ss/n,2)],['تباين العينة (القسمة على ⁦n − 1⁩)',f(ss/(n-1),2)],['الانحراف المعياري للعينة',f(Math.sqrt(ss/(n-1)),2)]
 ].map(r=>`<tr><td>${r[0]}</td><td class="v ltr" style="text-align:center">${r[1]}</td></tr>`).join('');
 const W=420,L=20,R=20,sx=v=>L+(v-0)/(60-0)*(W-L-R),Y=80;
 let g=`<line class="axis" x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}"/>`;
 for(let v=0;v<=60;v+=10)g+=`<line class="axis" x1="${sx(v)}" y1="${Y-4}" x2="${sx(v)}" y2="${Y+4}"/><text x="${sx(v)}" y="${Y+22}" font-size="11" text-anchor="middle">${v}</text>`;
 g+=`<line class="mk-mean" x1="${sx(mean)}" y1="20" x2="${sx(mean)}" y2="${Y}"/><line class="mk-med" x1="${sx(med)}" y1="20" x2="${sx(med)}" y2="${Y}"/>`;
 const seen={};
 [...BASE,last].forEach((v,i)=>{const k=seen[v]=(seen[v]||0)+1;g+=`<circle class="pt${i===4?' last':''}" cx="${sx(v)}" cy="${Y-8-(k-1)*12}" r="5"/>`});
 $('plot').innerHTML=g;
 $('msg').textContent=last>=30?`القيمة ${last} شاذة: المتوسط صار ${f(mean,2)} وابتعد عن معظم البيانات، والوسيط بقي ${f(med,2)}.`:'غيّر القيمة الأخيرة إلى رقم كبير، مثل 53 في السلايد 4، وقارن.';
}
$('last').oninput=draw;
draw();
</script>
</body>
</html>
